# ========================================
# Development Profile
# ========================================

# H2 File Database (for dev — data persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/bfc_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# More verbose SQL logging for development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# DevTools
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

# Upload directory for development
app.file.upload-dir=uploads

# CORS - allow all origins in dev (more permissive)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,http://localhost:3001,http://localhost:3002

# Swagger visible in dev
springdoc.swagger-ui.enabled=true

# Enable error messages in JSON responses
server.error.include-message=always

